[project]
name = "psat"
version = "0.1.0"
description = "Protocol Security Assessment Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13",
  "boto3>=1.34",
  "botocore>=1.42",
  "eth-abi>=5.0.0",
  "eth-account>=0.11.0",
  "eth-utils>=5.3.0",
  "fastapi>=0.135.1",
  "hypersync>=0.8.5",
  "playwright>=1.58.0",
  "psycopg2-binary>=2.9",
  "pydantic>=2.12",
  "pypdf>=5.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0",
  "requests>=2.32.0",
  "slither-analyzer>=0.11.0",
  "sqlalchemy>=2.0",
  "starlette>=1.0",
  "typing-extensions>=4.15",
  "urllib3>=2.6",
  # Never imported: CLI compiler consumed by crytic-compile for *.vy sources
  # (deploy/Dockerfile installs the same pin on PATH).
  "vyper==0.3.10",
  "uvicorn>=0.42.0",
  "pyjwt[crypto]>=2.12,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pyright>=1.1.0",
  "ruff>=0.9.0",
  "httpx>=0.28.1",
  "pytest-cov>=7.1.0",
  "responses>=0.25.0",
  "coverage>=7.6.0",
  "diff-cover>=10.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require a running API server and workers (deselected by default)",
    "smoke: read-only live tests safe to run against prod post-deploy (subset of `live`)",
    "compile: invokes a real solc/forge compile (slow; needs a local toolchain)",
    "anvil: spawns a local anvil node (slow; needs foundry on PATH)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "PGH"]

[tool.ruff.lint.per-file-ignores]
"services/crawlers/dapp/browser.py" = ["E501"]
"tests/static/test_effect_label_adversarial.py" = ["E501"]
"tests/static/test_symbolic_effects.py" = ["E501"]
"tests/**" = ["F811"]
# Alembic autogenerates one-column-per-line table definitions; line length
# isn't worth fighting with the generator.
"alembic/versions/*.py" = ["E501"]

[tool.coverage.run]
source = ["api", "workers", "services", "db", "utils", "routers", "schemas"]

[tool.coverage.report]
fail_under = 70
skip_empty = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
# Suppressions must be pyright-format with explicit rules; mypy-format
# ``type: ignore`` comments are inert (there is no mypy in this repo).
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
# ``scoring_prototype`` is a read-only diagnostic oracle committed as spec-packet
# material, not product code: nothing in the pipeline imports it and it is
# explicitly not to be fixed or iterated (SCORER_INTEGRATION_STRATEGY, "Status of
# scorer_v3.py"). The three entries after it are pyright's OWN defaults, restated
# because setting ``exclude`` replaces them rather than adding to them — omitting
# them walks ``.venv`` and every ``__pycache__`` into the check.
exclude = ["scoring_prototype", "**/node_modules", "**/__pycache__", "**/.*"]
