name: Main deploy

# Sequential chain on push to main:
#   1. ci      (same suite as PRs)
#   2. deploy  (prod; credentials scoped to the `production` environment)
on:
  push:
    branches: [main]

# Static group → multiple SHAs queue rather than race flyctl deploy.
concurrency:
  group: main-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_ci-checks.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # `production` scopes FLY_PROD_API_TOKEN; its deployment branch policy allows only main.
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
      PSAT_HEALTH_SECRET: ${{ secrets.PSAT_HEALTH_SECRET }}
      PROD_URL: https://snif.sh
      PSAT_LIFECYCLE_MODE: enforce
      PSAT_INDEXER_GROUP: monitor
      PSAT_MONITOR_MEMORY_MB: '2048'
    steps:
      - uses: actions/checkout@v4

      - name: Initialize lifecycle state path
        run: printf 'PSAT_LIFECYCLE_STATE_FILE=%s/psat-lifecycle.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Render production configuration
        # Runtime secrets are managed manually via `fly secrets set -a psat ...`; this workflow doesn't touch them.
        # GIT_SHA is baked into the image so /api/version can return it for post-deploy smoke checks.
        # Fly resolves relative build paths from the config file, so keep the generated config at the workspace root.
        run: |
          : "${PSAT_HEALTH_SECRET:?Set production secret PSAT_HEALTH_SECRET}"
          python - "$GITHUB_WORKSPACE/fly.production.toml" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          from deploy.production.control import render_config

          secret = os.environ["PSAT_HEALTH_SECRET"]
          if not re.fullmatch(r"[a-f0-9]{64}", secret):
              raise SystemExit("PSAT_HEALTH_SECRET must be a random 32-byte hex secret")
          source = render_config(
              Path("fly.toml").read_text(),
              mode=os.environ["PSAT_LIFECYCLE_MODE"],
              indexer=os.environ["PSAT_INDEXER_GROUP"],
              monitor_mb=int(os.environ["PSAT_MONITOR_MEMORY_MB"]),
          )
          marker = "REPLACE_WITH_PSAT_HEALTH_SECRET"
          if source.count(marker) != 1:
              raise SystemExit("fly.toml health-secret marker is missing or repeated")
          Path(sys.argv[1]).write_text(source.replace(marker, secret))
          bridge = render_config(source, mode="observe", indexer="workers", monitor_mb=2048)
          Path("fly.bridge.toml").write_text(bridge.replace(marker, secret))
          PY

      - name: Verify lifecycle credentials are provisioned before changing machines
        run: |
          flyctl secrets list -a psat --json > "$RUNNER_TEMP/psat-secret-names.json"
          python - "$RUNNER_TEMP/psat-secret-names.json" <<'PY'
          import json
          import sys
          names = {row["name"] for row in json.load(open(sys.argv[1]))}
          required = {"PSAT_LIFECYCLE_DATABASE_URL", "PSAT_WORKER_LIFECYCLE_TOKEN"}
          if required - names:
              raise SystemExit("Missing lifecycle secrets: " + ", ".join(sorted(required - names)))
          PY

      - name: Capture previous image and configuration for rollback
        id: snapshot
        run: python -m deploy.production.control snapshot --config "$GITHUB_WORKSPACE/fly.rollback.json"

      - name: Install managed ownership for the first activation
        id: bridge
        if: steps.snapshot.outputs.bridge_required == 'true'
        run: |
          flyctl deploy -a psat --config "$GITHUB_WORKSPACE/fly.bridge.toml" --remote-only \
            --build-arg GIT_SHA="${{ github.sha }}"
          python -m deploy.production.control restore
          python -m deploy.production.control verify --mode observe --indexer workers

      - name: Pause claims and stop workers before deployment
        id: lifecycle
        run: python -m deploy.production.control prepare

      - name: Deploy to production
        id: deploy
        env:
          BRIDGE_IMAGE: ${{ steps.bridge.outputs.image }}
        run: |
          image_args=()
          if [[ -n "$BRIDGE_IMAGE" ]]; then
            image_args=(--image "$BRIDGE_IMAGE" --skip-release-command)
          fi
          flyctl deploy -a psat --config "$GITHUB_WORKSPACE/fly.production.toml" --remote-only \
            --build-arg GIT_SHA="${{ github.sha }}" "${image_args[@]}"

      - name: Restore workers and verify running boot
        run: |
          python -m deploy.production.control restore
          python -m deploy.production.control verify

      - name: Wait for /api/health
        # /api/health is the deep probe — DB SELECT 1 + storage head_bucket. 503 on any failure.
        # 2 min ceiling matches the PR live-tests pattern; cold-start on prod is normally faster
        # because min_machines_running=1, but a release rolls a new machine.
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$PROD_URL/api/health" >/dev/null; then
              echo "prod healthy after attempt $i"
              exit 0
            fi
            echo "attempt $i: not healthy yet, sleeping 5s"
            sleep 5
          done
          echo "::error::Prod never healthy at $PROD_URL/api/health"
          curl -v --max-time 10 "$PROD_URL/api/health" || true
          exit 1

      - name: Verify deployed SHA matches commit
        # Catches "deploy reported success but old image is still serving" — e.g. a partial
        # rollout that left the previous release in place.
        # Polls because fly-proxy can still hit a draining old machine right after `flyctl deploy`
        # returns, especially when process groups change and old machines linger.
        run: |
          for i in $(seq 1 24); do
            DEPLOYED=$(curl -fsS --max-time 10 "$PROD_URL/api/version" | jq -r .sha || echo "")
            if [ "$DEPLOYED" = "${{ github.sha }}" ]; then
              echo "deployed SHA matches on attempt $i: $DEPLOYED"
              exit 0
            fi
            echo "attempt $i: deployed=$DEPLOYED expected=${{ github.sha }}, sleeping 5s"
            sleep 5
          done
          echo "::error::SHA never matched after 2min: last deployed=$DEPLOYED expected=${{ github.sha }}"
          exit 1

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev

      - name: Run read-only smoke tests against prod
        # `live and smoke` selects only files audited as pure-read in tests/live/conftest.py.
        # No /api/analyze, no PUT/PATCH/DELETE — safe against real data.
        env:
          PSAT_LIVE_URL: ${{ env.PROD_URL }}
        run: uv run pytest -m "live and smoke" -q

      - name: Activate lifecycle after successful deployment
        run: python -m deploy.production.control resume --activate

      - name: Restore previous release on handover, deployment, smoke, or activation failure
        id: rollback
        # A deployment can fail after draining or after updating only some groups.
        # Use the captured image/config pair and skip schema migration on the old image.
        if: failure() && steps.snapshot.outcome == 'success'
        run: |
          python -m deploy.production.control rollback
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "$PROD_URL/api/health" >/dev/null

      - name: Restore previous lifecycle pause after successful rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: python -m deploy.production.control resume
