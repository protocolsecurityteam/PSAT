name: CI checks

# Reusable suite — called by pr.yml (pull_request) and main.yml (push to main).
# Failures here block both PR previews and prod deploys via the caller's `needs:` chain.
#
# Path-based gating: on pull_request events, jobs skip when no relevant files
# changed (e.g. site-only PRs skip lint/typecheck/test). Push events to main
# bypass the gates and run everything — main is the source of truth and we
# want every job exercised regardless of what the push touched.
on:
  workflow_call:
    outputs:
      python:
        description: "Caller can use this to gate downstream jobs (e.g. live-tests)."
        value: ${{ jobs.changes.outputs.python }}
      frontend:
        description: "True when frontend files changed."
        value: ${{ jobs.changes.outputs.frontend }}
      ci-config:
        description: "True when CI / Docker / Fly config changed — implies run-everything."
        value: ${{ jobs.changes.outputs.ci-config }}

# Pinned here so a future caller can't widen scope by accident.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'alembic/**'
              - 'alembic.ini'
              - 'db/**'
              - 'tests/fixtures/**'
            frontend:
              # No negations: dorny/paths-filter ORs patterns, so `'!foo/**'`
              # would match every file outside foo/ and force frontend=true
              # on every PR.
              - 'site/**'
            ci-config:
              - '.github/workflows/**'
              - 'deploy/**'
              - 'fly.toml'
              - 'docker-compose.yml'

  lint:
    needs: changes
    # Bypass on push events (main pushes run everything).
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pyright

  frontend-test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      # install-deps is best-effort: it apt-installs from azure.archive.ubuntu.com,
      # which has recurring outages, and the runner image already ships the libraries.
      - run: timeout 210 npx playwright install-deps chromium || echo "::warning::playwright install-deps failed or stalled (apt mirror outage?); relying on runner-image libraries"
      - run: npx playwright install chromium
      - run: npx playwright test
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
        working-directory: .
      - run: npm run build
      - run: npx playwright test --config playwright.cloudflare.config.js

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psat
          POSTGRES_PASSWORD: psat
          POSTGRES_DB: psat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COVERAGE_FILE: ci-results/.coverage.${{ matrix.shard }}
      # Model imports build engines from DATABASE_URL; fixtures use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://psat:psat@localhost:5432/psat_test
      TEST_DATABASE_URL: postgresql://psat:psat@localhost:5432/psat_test
      TEST_ARTIFACT_STORAGE_ENDPOINT: http://localhost:9000
      TEST_ARTIFACT_STORAGE_BUCKET: psat-artifacts-test
      TEST_ARTIFACT_STORAGE_ACCESS_KEY: psat-minio
      TEST_ARTIFACT_STORAGE_SECRET_KEY: psat-minio-secret
      # Routes scope_extraction._call_llm to fixtures; without this, integration tests hit OpenRouter.
      PSAT_LLM_STUB_DIR: tests/fixtures/scope_extraction/llm_responses
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: astral-sh/setup-uv@v5
      - name: Start minio
        run: |
          # The upstream container images are no longer publicly pullable.
          # Use the same official release, pinned independently of its download URL.
          minio_dir=$(mktemp -d "$RUNNER_TEMP/psat-minio.XXXXXX")
          curl -fSL --retry 3 --connect-timeout 10 --max-time 120 \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z \
            -o "$minio_dir/minio"
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $minio_dir/minio" | sha256sum --check
          chmod +x "$minio_dir/minio"
          MINIO_ROOT_USER=psat-minio MINIO_ROOT_PASSWORD=psat-minio-secret \
            "$minio_dir/minio" server "$minio_dir/data" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > "$minio_dir/minio.log" 2>&1 &
          minio_pid=$!
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "minio ready"
              exit 0
            fi
            if ! kill -0 "$minio_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "minio failed to become ready"
          cat "$minio_dir/minio.log"
          exit 1
      - run: uv sync --dev --locked
      - run: forge --version
      # The offline network guard blocks solc downloads inside pytest, so any
      # test needing a real solc resolves it from solc-select's local store and
      # skips when absent. Preinstall one >=0.8.26 here (outside the guard) so
      # the custom-error require tests actually run instead of skipping.
      # `use` is load-bearing: install alone leaves no global version selected,
      # and with a NON-empty store the solc shim skips its bootstrap-latest
      # fallback (the accident bare-Slither compiles relied on before) and
      # halts with "No solc version set", failing every bare-Slither test.
      # 0.8.25 is a SECOND pinned version, not a replacement: the timelock
      # producer-parity test compiles a real verified source pinned to it and
      # must FAIL rather than skip when it is missing, so CI has to carry it.
      # Only `use` sets the shared global version — installing an extra artifact
      # cannot flip it, and the pinned-version tests drive their binary by
      # absolute path (FOUNDRY_SOLC / crytic `solc=`), never via the global.
      - name: Install solc for real-Slither tests
        run: |
          uv run solc-select install 0.8.27
          uv run solc-select install 0.8.25
          uv run solc-select use 0.8.27
      # The browser download (Playwright CDN) and the --with-deps apt run both
      # stall intermittently on hosted runners, and a stalled connection has no
      # read timeout — an unbounded step then wedges the job for hours. Cache
      # the browser store keyed on the locked Playwright version so most runs
      # skip the download entirely, and bound + retry the install so a stall
      # costs minutes, not the job.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright browser
        timeout-minutes: 12
        run: |
          # Browser binaries (cached above, no apt involved) must install; the
          # system-deps half runs apt against azure.archive.ubuntu.com, which
          # has recurring outages — the runner image already ships Chromium's
          # libraries, so a mirror outage must not fail the build.
          if ! timeout 210 uv run playwright install-deps chromium; then
            echo "::warning::playwright install-deps failed (apt mirror outage?); relying on runner-image libraries"
          fi
          for attempt in 1 2 3; do
            if timeout 210 uv run playwright install chromium; then
              exit 0
            fi
            echo "playwright browser install attempt ${attempt} failed or stalled; retrying"
          done
          echo "playwright browser install failed after 3 attempts"
          exit 1
      - name: Create test database
        run: PGPASSWORD=psat psql -h localhost -U psat -d psat -c "CREATE DATABASE psat_test OWNER psat;"

      # Migration parity: alembic upgrade head builds the schema from scratch,
      # then `alembic check` fails the build if Base.metadata has drifted from
      # the latest revision (i.e. someone changed a model without writing a
      # migration).
      - name: Alembic upgrade + drift check
        env:
          DATABASE_URL: postgresql://psat:psat@localhost:5432/psat_test
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # `-p local_netguard` is the socket-level backstop: it fails the offline
      # job if any test attempts a real connect to a public IP (the in-process
      # guard in tests/conftest.py is the first line of defense; this catches
      # anything that bypasses `requests`/`urllib`). See tests/conftest.py.
      - name: Run test shard with coverage
        run: |
          mkdir -p ci-results
          uv run coverage run -m pytest -m "not live" -p local_netguard \
            -p tests.ci_sharding --ci-shard=${{ matrix.shard }} -q

      - name: Upload shard coverage and test manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-shard-${{ matrix.shard }}
          path: |
            ci-results/.coverage.${{ matrix.shard }}
            ci-results/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          # Stable names allow a failed-job rerun to replace just that shard.
          overwrite: true
          retention-days: 7

  coverage:
    needs: [changes, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover needs origin/main history
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: python-shard-*
          path: coverage-data
          merge-multiple: true
      - name: Validate shard completeness and coverage data
        run: uv run python -m tests.ci_sharding coverage-data --revision="$GITHUB_SHA"
      - name: Combine coverage
        run: uv run coverage combine coverage-data

      - name: Coverage report
        run: |
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(uv run coverage report --format=total)
          echo "**Total coverage: ${TOTAL}%**" >> $GITHUB_STEP_SUMMARY
          uv run coverage report

      - name: Generate coverage XML for diff-cover
        if: github.event_name == 'pull_request'
        run: uv run coverage xml -o coverage.xml

      # In addition to the total coverage floor, gate lines this PR added/changed.
      - name: Diff coverage check
        if: github.event_name == 'pull_request'
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=70 \
            --html-report diff-cover.html \
            --markdown-report diff-cover.md
          cat diff-cover.md >> $GITHUB_STEP_SUMMARY

      - name: Upload diff-cover HTML report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          overwrite: true
          path: diff-cover.html
          if-no-files-found: ignore

  # Keep this as the sole required branch-protection check. Skips are allowed
  # only when the path filter says that suite is unnecessary.
  ci-pass:
    needs: [changes, lint, typecheck, frontend-test, test, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate upstream results
        env:
          PYTHON_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true' }}
          FRONTEND_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci-config == 'true' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          fail=0
          check_result() {
            local name=$1 result=$2 required=$3
            if [[ "$result" != "success" && ( "$required" == "true" || "$result" != "skipped" ) ]]; then
              echo "::error::$name result: $result (required: $required)"
              fail=1
            fi
          }
          check_result changes "$CHANGES_RESULT" true
          check_result lint "$LINT_RESULT" "$PYTHON_REQUIRED"
          check_result typecheck "$TYPECHECK_RESULT" "$PYTHON_REQUIRED"
          check_result frontend-test "$FRONTEND_RESULT" "$FRONTEND_REQUIRED"
          check_result test "$TEST_RESULT" "$PYTHON_REQUIRED"
          check_result coverage "$COVERAGE_RESULT" "$PYTHON_REQUIRED"
          exit "$fail"
