name: PR comment commands

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Authorize exact command and resolve trusted PR
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const command = context.payload.comment.body.trim();
            const supported = new Map([
              ['/reset-db', 'reset-pr-db.yml'],
              ['/rerun-tests', 'rerun-live-tests.yml'],
            ]);
            if (command === '/fork-prod') {
              core.setFailed('/fork-prod is disabled until the separately approved production-read credential and data policy exist');
              return;
            }
            if (!supported.has(command)) {
              core.setOutput('accepted', 'false');
              return;
            }

            const login = context.payload.comment.user.login;
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: login,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.permission)) {
              core.setFailed(`@${login} lacks write permission`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            if (pr.state !== 'open' || pr.base.ref !== 'main') {
              core.setFailed('Preview commands require an open PR into main');
              return;
            }
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Privileged preview commands reject fork PRs');
              return;
            }
            core.setOutput('workflow', supported.get(command));
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('accepted', 'true');

      - name: React to accepted command
        if: steps.request.outputs.accepted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Dispatch workflow from protected default branch
        if: steps.request.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ steps.request.outputs.workflow }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
        run: |
          gh workflow run "$WORKFLOW" --ref main \
            -f pr_number="$PR_NUMBER" -f head_sha="$HEAD_SHA" \
            --repo "$GITHUB_REPOSITORY"
