name: Fork prod DB to PR preview (disabled)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open, same-repository PR number"
        required: true
        type: string
      head_sha:
        description: "Current PR head SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse production-data fork
        run: |
          echo "::error::/fork-prod is disabled. Configure a separately approved GitHub environment, a narrowly production-read Neon credential, snapshot sanitization, and exceptional-fork cleanup before enabling it."
          exit 1
