app = "psat"
primary_region = "iad"
kill_signal = "SIGTERM"
# Slither/Playwright subprocesses don't honor SIGTERM, so a longer
# grace period just delays deploys. reclaim_stuck_jobs picks up
# interrupted work after SIGKILL.
kill_timeout = 30

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  PSAT_RPC_ROUTING_IDENTITY = "production-erpc-v1"
  PSAT_EDGE_MODE = "cloudflare"
  PSAT_SITE_ORIGIN = "https://snif.sh"
  # Bumped from deploy/start_workers.sh defaults (2/1/1). Sized for the workers VM
  # (shared-cpu-8x:16GB) — 8 cores fit ~12 always-on Python procs plus
  # forge subprocess bursts without queueing. Policy bumped to 3 procs ×
  # K=2 (=6 concurrent jobs) now that the static-stage predicate fix has
  # lifted CPU saturation and policy is the next downstream bottleneck.
  PSAT_STATIC_WORKERS = "3"
  PSAT_RESOLUTION_WORKERS = "2"
  PSAT_POLICY_WORKERS = "3"
  PSAT_POLICY_JOB_CONCURRENCY = "2"
  # Read-through cache (artifact bucket, 30-day TTL, keyed on request hash) for
  # Exa/Tavily research. PR previews set these via --env (pr.yml); prod lacked
  # them, so discovery ran slow LIVE research every time (root discovery job
  # ~13 min). Cache misses still fall through to a live call that is persisted.
  PSAT_EXA_CACHE = "1"
  PSAT_TAVILY_CACHE = "1"
  # Arm the policy->effects stage transition (EFFECTS_RESOLUTION_SPEC §5.1). The
  # effects worker already launches unconditionally from deploy/start_workers.sh, so the
  # flag only gates the transition, never a parked-job hazard.
  PSAT_EFFECTS_STAGE = "1"

# One-shot schema migration in a temporary machine. Runs once per
# deploy, before any long-lived machine boots — so the four process
# groups don't race on DDL locks during rolling deploys.
[deploy]
  release_command = "uv run --no-sync alembic upgrade head"

# Each group scales independently. `fly scale count --process-group <name> N`.
# monitor scan/poll passes are daemon-lease-gated singletons: scaling above 1
# is safe (duplicates acquire nothing and skip) but wasteful — run 1.
[processes]
  web     = "./deploy/start_web.sh"
  workers = "./deploy/start_workers.sh"
  browser = "./deploy/start_browser.sh"
  monitor = "./deploy/start_monitor.sh"

# HTTP routing + health checks only apply to the API group.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Prod: keep ≥1 web machine warm so user requests don't hit a cold start.
  # Previews override this to 0 via a derived config in pr.yml.
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.http_checks]]
    method = "get"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    [http_service.http_checks.headers]
      # main.yml replaces this in a protected temporary config before deploy.
      # Leaving the placeholder intact fails the production health check closed.
      X-PSAT-Health-Secret = "REPLACE_WITH_PSAT_HEALTH_SECRET"

# Per-group VM sizing. Tune with `fly scale vm <size> --process-group <name>`.

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["workers"]
  # Sized for peak run-queue depth: ~12 always-on Python worker procs +
  # forge/solc subprocess bursts during recursive resolution + audit
  # PyPDF parse threads. On 2 vCPUs this oversubscribed at load avg ~9
  # and discovery / audit / static throughput all dropped 10-30×; 8
  # cores brings peak contenders per core back to a healthy ~3.
  size = "shared-cpu-8x"
  memory = "16gb"

# Playwright Chromium is RAM-heavy; give it its own headroom.
[[vm]]
  processes = ["browser"]
  size = "shared-cpu-2x"
  memory = "2gb"

[[vm]]
  processes = ["monitor"]
  size = "shared-cpu-1x"
  memory = "512mb"

# The monitor VM must degrade-and-page, never permanently stop. With the
# boot-reconcile OOM removed and heavy compute off this box, a crash-loop is
# now a bug to alert on, not a reason to exhaust the fly retry budget.
[[restart]]
  policy = "always"
  processes = ["monitor"]
